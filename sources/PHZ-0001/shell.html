<title>PHIZ Business Messaging RFC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>/*CSS*/</style>
<style>/*SWAGGERCSS*/</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand"><span class="logo" aria-hidden="true">P</span><span>PHIZ Open Platform</span><span class="rfcno">RFC PHZ-0001</span></div>
    <div class="langs" role="group" aria-label="Language / Idioma / 语言">
      <button type="button" data-set-lang="pt" id="btn-pt">PT-BR</button>
      <button type="button" data-set-lang="en" id="btn-en">EN-US</button>
      <button type="button" data-set-lang="zh" id="btn-zh">中文</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="toc" aria-label="Sumário">
    <details open id="toc-details">
      <summary><span data-l="pt">Sumário</span><span data-l="en">Contents</span><span data-l="zh">目录</span></summary>
      <!--TOC-->
    </details>
  </aside>
  <main>
    <!--CONTENT-->
    <div class="swagger-wrap">
      <div class="swagger-tools">
        <button type="button" class="btn" id="copy-yaml"><span data-l="pt">Copiar OpenAPI (YAML)</span><span data-l="en">Copy OpenAPI (YAML)</span><span data-l="zh">复制 OpenAPI (YAML)</span></button>
        <span class="note" id="copy-note" aria-live="polite"></span>
      </div>
      <div id="swagger-ui"></div>
      <textarea id="yaml-fallback" aria-label="OpenAPI YAML" readonly hidden></textarea>
    </div>
  </main>
</div>

<script>/*SPECS*/</script>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
(function () {
  const LANGS = ["pt", "en", "zh"];
  const COPY = { pt: ["Copiado", "Selecione e copie o texto abaixo"], en: ["Copied", "Select and copy the text below"], zh: ["已复制", "请选中下方文本并复制"] };
  let current = null;

  function pick() {
    const h = (location.hash || "").replace("#", "");
    if (LANGS.includes(h)) return h;
    const pre = LANGS.find(l => h.startsWith(l + "-"));
    if (pre) return pre;
    try { const s = localStorage.getItem("phiz-rfc-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
    return "pt";
  }

  function renderSwagger(lang) {
    if (!window.SwaggerUIBundle) return;
    document.getElementById("swagger-ui").innerHTML = "";
    window.SwaggerUIBundle({
      spec: window.PHIZ_SPECS[lang], dom_id: "#swagger-ui", deepLinking: false,
      supportedSubmitMethods: [], defaultModelsExpandDepth: 0, docExpansion: "list", tryItOutEnabled: false
    });
  }

  function setLang(lang) {
    if (lang === current) return;
    current = lang;
    document.documentElement.setAttribute("lang", { pt: "pt-BR", en: "en", zh: "zh-CN" }[lang]);
    document.documentElement.dataset.lang = lang;
    document.querySelectorAll(".lang, .toc-list").forEach(el => el.classList.toggle("active", el.dataset.lang === lang));
    document.querySelectorAll("[data-set-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.setLang === lang)));
    try { localStorage.setItem("phiz-rfc-lang", lang); } catch (e) {}
    renderSwagger(lang);
  }

  document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => {
    const sec = location.hash.replace("#", "");
    setLang(b.dataset.setLang);
    if (sec.length > 3) {
      const target = document.getElementById(b.dataset.setLang + sec.slice(2));
      if (target) target.scrollIntoView();
    }
  }));

  window.addEventListener("hashchange", () => { const l = pick(); if (l !== current) setLang(l); });

  async function copyText(text, onFail) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { onFail && onFail(); return false; }
  }

  document.addEventListener("click", async e => {
    const btn = e.target.closest("[data-copy]");
    if (!btn) return;
    const code = btn.closest("figure").querySelector("code");
    const ok = await copyText(code.innerText, () => {
      const r = document.createRange(); r.selectNodeContents(code);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    });
    btn.textContent = ok ? "COPIED" : "SELECTED";
    setTimeout(() => (btn.textContent = "COPY"), 1600);
  });

  document.getElementById("copy-yaml").addEventListener("click", async () => {
    const text = window.PHIZ_YAML[current];
    const note = document.getElementById("copy-note");
    const fb = document.getElementById("yaml-fallback");
    const ok = await copyText(text);
    if (ok) { note.textContent = COPY[current][0]; fb.hidden = true; }
    else { fb.value = text; fb.hidden = false; fb.select(); note.textContent = COPY[current][1]; }
    setTimeout(() => (note.textContent = ""), 2500);
  });

  if (matchMedia("(max-width: 960px)").matches) document.getElementById("toc-details").removeAttribute("open");
  setLang(pick());
})();
</script>
